<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Helper — AI Chatbot for YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --sidebar-bg: #111827;
      --card-bg: #1e293b;
      --input-bg: #1e293b;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --glow-purple: rgba(168, 85, 247, 0.35);
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --border-color: rgba(255, 255, 255, 0.12);
      --user-bubble: #4f46e5;
      --bot-bubble: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html {
      font-size: 16px;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      display: flex;
      overflow: hidden;
      font-size: 15px;
    }

    /* Clean Sidebar (260px wide) */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      flex-shrink: 0;
      z-index: 10;
      transition: margin-left 0.3s ease;
    }

    .sidebar.collapsed {
      margin-left: -260px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px var(--glow-purple);
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
    }

    .status-tag {
      font-size: 0.78rem;
      font-weight: 600;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
    }

    .btn-new-chat {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #ffffff;
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-new-chat:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(168, 85, 247, 0.4);
    }

    /* Ingestion Box */
    .ingest-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .box-header {
      font-size: 0.8rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-field {
      width: 100%;
      height: 42px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: #a855f7;
    }

    .btn-action {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      height: 42px;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      box-shadow: 0 4px 16px var(--glow-purple);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .video-card {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .video-card img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }

    .video-id-badge {
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    /* Main Viewport */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Topbar Header */
    .topbar {
      height: 60px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b1120;
    }

    .toggle-sidebar-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .model-badge {
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #d8b4fe;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .top-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .top-link:hover {
      color: #ffffff;
    }

    /* Chat Messages Canvas */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Hero Welcome Screen */
    .hero-welcome {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 820px;
      padding: 20px;
    }

    .hero-icon {
      width: 68px;
      height: 68px;
      background: var(--accent-gradient);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px var(--glow-purple);
    }

    .hero-icon svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    /* Clean Heading: 32px */
    .hero-title {
      font-size: 2rem; /* 32px */
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    /* Subtitle: 15px */
    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem; /* 15px */
      line-height: 1.6;
      max-width: 600px;
    }

    /* Prompt Cards Grid - 2 columns x 2 rows */
    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      margin-top: 14px;
    }

    .prompt-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 22px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 95px;
      height: 100%;
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }

    /* Feature Card Header: 15px */
    .prompt-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem; /* 15px */
      color: #d8b4fe;
      line-height: 1.3;
    }

    /* Feature Card Description: 13.5px */
    .prompt-card-desc {
      color: var(--text-muted);
      font-size: 0.85rem; /* 13.5px */
      line-height: 1.45;
    }

    .prompt-card:hover {
      border-color: #a855f7;
      background: #283548;
      transform: translateY(-2px);
    }

    /* Message Rows & Bubbles */
    .msg-row {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.user .avatar {
      order: 2;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .user .avatar {
      background: var(--user-bubble);
      color: #ffffff;
    }

    .bot .avatar {
      background: var(--accent-gradient);
      color: #ffffff;
    }

    .bubble {
      background: var(--bot-bubble);
      padding: 18px 24px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
      line-height: 1.65;
      font-size: 0.95rem; /* 15px */
      color: #ffffff;
      word-break: break-word;
    }

    .user .bubble {
      background: var(--user-bubble);
      border: none;
      color: #ffffff;
      max-width: 80%;
    }

    .bot .bubble {
      flex: 1;
      max-width: 90%;
    }

    .bot .bubble p { margin-bottom: 12px; }
    .bot .bubble p:last-child { margin-bottom: 0; }
    .bot .bubble ul, .bot .bubble ol { margin-left: 22px; margin-bottom: 12px; }
    .bot .bubble li { margin-bottom: 4px; }
    .bot .bubble code { background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; color: #f472b6; }
    .bot .bubble pre { background: #0f172a; padding: 16px; border-radius: 12px; overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border-color); }

    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn:hover {
      color: #ffffff;
      border-color: #a855f7;
    }

    /* Floating Chat Input Dock Section */
    .input-dock {
      padding: 16px 24px 24px 24px;
      background: linear-gradient(to top, var(--bg-main) 85%, transparent);
      z-index: 5;
    }

    .dock-wrapper {
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }

    .input-pill {
      display: flex;
      gap: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 16px;
      align-items: center;
      min-height: 52px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-pill:focus-within {
      border-color: #a855f7;
      box-shadow: 0 0 25px var(--glow-purple);
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem; /* 15px */
      font-weight: 500;
      resize: none;
      max-height: 140px;
      height: 30px;
      line-height: 1.5;
    }

    .chat-textarea::placeholder {
      color: #94a3b8;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 16px var(--glow-purple);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px var(--glow-purple);
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 800px) {
      .prompt-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body></body>
</html>
